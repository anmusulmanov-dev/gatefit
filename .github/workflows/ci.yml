name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without code changes: re-run the dependency audit weekly.
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Reads the lockfile only; no install needed.
      - name: Audit production dependencies (high and above)
        run: pnpm audit --prod --audit-level high
      - name: Audit all dependencies (critical)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level critical

  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatefit
          POSTGRES_PASSWORD: gatefit
          POSTGRES_DB: gatefit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatefit -d gatefit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://gatefit_app:gatefit_app@localhost:5432/gatefit
      DATABASE_ADMIN_URL: postgresql://gatefit_migrator:gatefit_migrator@localhost:5432/gatefit
      TEST_DATABASE_URL: postgresql://gatefit_app:gatefit_app@localhost:5432/gatefit_test
      TEST_DATABASE_ADMIN_URL: postgresql://gatefit_migrator:gatefit_migrator@localhost:5432/gatefit_test
      REDIS_URL: redis://localhost:6379
      # Throwaway values for the CI database only.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      DATA_ENCRYPTION_KEY: Y2ktb25seS1kYXRhLWVuY3J5cHRpb24ta2V5LTMyYnk=
      # Not contacted yet; present because the API validates its whole configuration at startup.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      S3_BUCKET: gatefit-ci

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create database roles and test database
        run: bash infra/postgres/init.sh
        env:
          PGHOST: localhost
          PGPASSWORD: gatefit
          POSTGRES_USER: gatefit
          POSTGRES_DB: gatefit
          DB_APP_PASSWORD: gatefit_app
          DB_MIGRATOR_PASSWORD: gatefit_migrator

      - name: Apply migrations
        run: pnpm --filter api prisma migrate deploy

      - run: pnpm format:check
      - name: Translations complete in uz, ru and en
        run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
